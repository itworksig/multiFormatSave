name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version' Makefile | head -1 | sed 's/version[[:space:]]*=[[:space:]]*//')
          VERSION_DASHES=$(echo "$VERSION" | tr '.' '-')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "filename=multiFormatSave_v${VERSION_DASHES}.oxt" >> $GITHUB_OUTPUT
          echo "Version: $VERSION → multiFormatSave_v${VERSION_DASHES}.oxt"

      - name: Check tag exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }} already exists, skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }} does not exist, proceeding."
          fi

      - name: Generate release notes
        if: steps.tag_check.outputs.exists == 'false'
        id: notes
        run: |
          # Find the previous version tag (exclude the one we're about to create)
          PREV_TAG=$(git tag --sort=-version:refname \
            | grep -v "^v${{ steps.version.outputs.version }}$" \
            | head -1)

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges)
          else
            # First release — only show commits that touch plugin files or workflow
            COMMITS=$(git log --oneline --no-merges \
              -- plugin/ .github/ Makefile README.md \
              | head -20)
          fi

          FEATURES=""
          FIXES=""
          OTHERS=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            HASH=$(echo "$line" | awk '{print $1}')
            MSG=$(echo "$line" | cut -d' ' -f2-)

            if echo "$MSG" | grep -qiE '^feat(\(.+\))?:'; then
              SCOPE=$(echo "$MSG" | sed -E 's/^feat\(([^)]+)\):.*/\1/')
              if [ "$SCOPE" = "$MSG" ]; then SCOPE="general"; fi
              BODY=$(echo "$MSG" | sed -E 's/^feat(\([^)]+\))?:[[:space:]]*//')
              FEATURES="${FEATURES}\n- **${SCOPE}**: ${BODY} (\`${HASH}\`)"

            elif echo "$MSG" | grep -qiE '^fix(\(.+\))?:'; then
              SCOPE=$(echo "$MSG" | sed -E 's/^fix\(([^)]+)\):.*/\1/')
              if [ "$SCOPE" = "$MSG" ]; then SCOPE="general"; fi
              BODY=$(echo "$MSG" | sed -E 's/^fix(\([^)]+\))?:[[:space:]]*//')
              FIXES="${FIXES}\n- **${SCOPE}**: ${BODY} (\`${HASH}\`)"

            else
              OTHERS="${OTHERS}\n- ${MSG} (\`${HASH}\`)"
            fi
          done <<< "$COMMITS"

          DATE=$(date '+%Y-%m-%d')
          {
            echo "notes<<RELEASE_EOF"
            echo "## What's Changed"
            echo ""
            echo "_Released on ${DATE}_"
            if [ -n "$FEATURES" ]; then
              echo ""
              echo "### ✨ Features"
              echo -e "$FEATURES"
            fi
            if [ -n "$FIXES" ]; then
              echo ""
              echo "### 🐛 Bug Fixes"
              echo -e "$FIXES"
            fi
            if [ -n "$OTHERS" ]; then
              echo ""
              echo "### 🔧 Changes"
              echo -e "$OTHERS"
            fi
            if [ -z "$FEATURES" ] && [ -z "$FIXES" ] && [ -z "$OTHERS" ]; then
              echo ""
              echo "_No significant changes logged._"
            fi
            echo ""
            echo "---"
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${{ steps.version.outputs.version }}"
            else
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/v${{ steps.version.outputs.version }}"
            fi
            echo "RELEASE_EOF"
          } >> $GITHUB_OUTPUT

      - name: Build .oxt package
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          make
          OXT=$(ls *.oxt 2>/dev/null | head -1)
          if [ -z "$OXT" ]; then
            echo "ERROR: No .oxt file was produced by make"
            exit 1
          fi
          echo "Built: $OXT"
          echo "oxt_file=$OXT" >> $GITHUB_ENV

      - name: Create git tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" \
            -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: MultiFormatSave v${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          files: "*.oxt"
          draft: false
          prerelease: false
